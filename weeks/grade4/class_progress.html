<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Progress — Grade 4 Math Challenge</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, Arial, sans-serif; background: #f0f4ff; color: #1e293b; padding: 24px 16px 64px; }
.page { max-width: 720px; margin: 0 auto; }

.topnav { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.topnav a {
  text-decoration: none; font-size: 14px; font-weight: 700; color: #4338ca;
  background: #fff; border-radius: 999px; padding: 8px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.07);
}
.topnav a:hover { background: #eef2ff; }

.header {
  background: linear-gradient(135deg, #0f766e, #0d9488); color: #fff; border-radius: 18px;
  padding: 28px 32px; margin-bottom: 20px; box-shadow: 0 6px 24px rgba(13,148,136,.3); text-align: center;
}
.header h1 { font-size: 29px; font-weight: 900; letter-spacing: -.5px; }
.header p { font-size: 15px; opacity: .92; margin-top: 8px; }

/* ── view switch ─────────────────────────────────────────── */
.tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; flex-wrap: wrap; }
.tabs button {
  font: inherit; font-size: 14px; font-weight: 700; color: #475569; background: #fff; border: 0;
  padding: 10px 18px; border-radius: 999px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.07);
}
.tabs button:hover { background: #f1f5f9; }
.tabs button.active { background: #0d9488; color: #fff; }
select {
  font: inherit; font-size: 14px; padding: 9px 12px; border-radius: 10px; border: 1px solid #cbd5e1;
  background: #fff; color: #1e293b; margin: 0 auto 6px; display: block;
}
.caption { text-align: center; font-size: 13.5px; color: #64748b; margin: 10px 4px 18px; line-height: 1.55; }

/* ── class card ──────────────────────────────────────────── */
.card {
  background: #fff; border-radius: 16px; padding: 22px 24px; margin-bottom: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
}
.card .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.card .cname { font-size: 18px; font-weight: 800; }
.card .csize { font-size: 13px; color: #64748b; }
.card .pct { margin-left: auto; font-size: 26px; font-weight: 900; letter-spacing: -1px; color: #0f766e; font-variant-numeric: tabular-nums; }

/* the arrow meter */
.mlbl { font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: #94a3b8; margin-bottom: 7px; }
.meter { position: relative; height: 22px; margin: 2px 0 10px; }
.meter .track { position: absolute; inset: 0; background: #eef2f7; border-radius: 11px; overflow: hidden; }
.meter .fill {
  position: absolute; left: 0; top: 0; bottom: 0; border-radius: 11px 0 0 11px;
  background: linear-gradient(90deg, #14b8a6, #0d9488);
  transition: width .6s cubic-bezier(.22,.8,.3,1);
}
.meter .arrow {
  position: absolute; top: 50%; width: 0; height: 0; margin-top: -9px; margin-left: -1px;
  border-top: 9px solid transparent; border-bottom: 9px solid transparent; border-left: 11px solid #0d9488;
  transition: left .6s cubic-bezier(.22,.8,.3,1); filter: drop-shadow(0 1px 2px rgba(0,0,0,.18));
}
.meter .goal { position: absolute; right: 0; top: -2px; bottom: -2px; width: 2px; background: #cbd5e1; border-radius: 1px; }
.detail { font-size: 13.5px; color: #64748b; }
.detail b { color: #1e293b; font-weight: 700; }

/* The two levers, shown above the result. Each gets its own hue AND its own
   label — colour never carries the meaning on its own. */
.lever { margin-bottom: 13px; }
.lever .row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.lever .lbl { font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: #94a3b8; }
.lever .val { margin-left: auto; font-size: 17px; font-weight: 900; font-variant-numeric: tabular-nums; }
.lever .bar { height: 10px; border-radius: 5px; overflow: hidden; }
.lever .bar i { display: block; height: 100%; border-radius: 5px; transition: width .6s cubic-bezier(.22,.8,.3,1); }
.lever .note { font-size: 12.5px; color: #64748b; margin-top: 5px; }
.lever .note b { color: #1e293b; font-weight: 700; }

/* took part — the lever anyone can move, whatever they score */
.lever.part .val { color: #4338ca; }
.lever.part .bar { background: #e0e7ff; }
.lever.part .bar i { background: linear-gradient(90deg, #6366f1, #4f46e5); }

/* got right — accuracy on what was actually attempted */
.lever.right .val { color: #b45309; }
.lever.right .bar { background: #fef3c7; }
.lever.right .bar i { background: linear-gradient(90deg, #f59e0b, #d97706); }

/* the result line: took part × got right = collected */
.equals { font-size: 12.5px; color: #64748b; text-align: center; margin: 4px 0 10px; }
.equals b { color: #1e293b; font-weight: 800; }
.equals .x { color: #cbd5e1; margin: 0 5px; }
.result { border-top: 1px solid #eef2f7; padding-top: 14px; margin-top: 4px; }

/* ── week-by-week strip ──────────────────────────────────── */
.strip { margin-top: 16px; border-top: 1px solid #eef2f7; padding-top: 14px; }
.strip .lbl { font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: #94a3b8; margin-bottom: 10px; }
.wk { display: grid; grid-template-columns: 62px 1fr 96px; gap: 10px; align-items: center; margin-bottom: 7px; font-size: 12.5px; }
.wk .n { color: #64748b; font-weight: 700; }
.wk .bar { height: 9px; background: #eef2f7; border-radius: 5px; overflow: hidden; }
.wk .bar i { display: block; height: 100%; background: #14b8a6; border-radius: 5px; }
.wk .v { text-align: right; color: #64748b; font-variant-numeric: tabular-nums; }
.wk.none .v { color: #cbd5e1; }

.msg { background: #fff; border-radius: 14px; padding: 22px 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); font-size: 14.5px; line-height: 1.6; color: #475569; }
.msg h3 { font-size: 16px; font-weight: 800; color: #1e293b; margin-bottom: 8px; }
.msg code { background: #f1f5f9; border-radius: 5px; padding: 1px 6px; font-size: 13px; }
.msg ol { margin: 10px 0 0 20px; }
.msg li { margin-bottom: 6px; }
.msg table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
.msg th, .msg td { border: 1px solid #cbd5e1; padding: 4px 12px; text-align: left; }
.msg th { background: #f8fafc; font-weight: 800; }

.warn { background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 14px 16px; font-size: 13px; color: #92400e; line-height: 1.55; margin-bottom: 14px; }
.warn b { font-weight: 800; }

.refresh { display: block; margin: 18px auto 0; font: inherit; font-size: 13px; font-weight: 700; color: #475569;
  background: #fff; border: 0; padding: 9px 18px; border-radius: 999px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
.refresh:hover { background: #f1f5f9; }
.foot { text-align: center; font-size: 12.5px; color: #94a3b8; margin-top: 18px; line-height: 1.6; }

@media (max-width: 520px) {
  .header { padding: 22px 18px; }
  .header h1 { font-size: 24px; }
  .card { padding: 18px 16px; }
  .card .pct { font-size: 22px; }
  .wk { grid-template-columns: 52px 1fr 78px; font-size: 11.5px; }
}
</style>
</head>
<body>
<div class="page">

  <div class="topnav">
    <a href="../../index.html">🏠 Home</a>
    <a href="leaderboard.html">🏆 Individual leaderboard</a>
  </div>

  <div class="header">
    <h1>📈 Class Progress</h1>
    <p>Grade 4 &middot; how far each class has climbed together</p>
  </div>

  <div class="tabs">
    <button id="tabTotal" class="active" onclick="selectTotal()">Whole challenge</button>
    <button id="tabWeek" onclick="selectWeekMode()">By week</button>
  </div>
  <select id="weekSelect" style="display:none" onchange="load()"></select>

  <p class="caption" id="caption"></p>

  <div id="warn"></div>
  <div id="body"><div class="msg">Loading…</div></div>

  <button class="refresh" id="refreshBtn" onclick="load(true)">↻ Refresh</button>

  <p class="foot">
    Just taking part moves your class forward — the blue bar goes up<br>
    even if you don't get a single answer right.
  </p>
</div>

<script>
// Same Google Apps Script Web App as the problem pages and the individual leaderboard.
const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbx5Xl-3-NRx5vnqZVKx4_7XiJI1iKR4Wiit8beSmlm15rJX-Fs7LBZrkk6IFseDSFK3Jw/exec";

let mode = 'total';          // 'total' | 'week'
let selectedWeek = '';

function selectTotal() {
  mode = 'total';
  document.getElementById('tabTotal').classList.add('active');
  document.getElementById('tabWeek').classList.remove('active');
  document.getElementById('weekSelect').style.display = 'none';
  render();
}
function selectWeekMode() {
  mode = 'week';
  document.getElementById('tabWeek').classList.add('active');
  document.getElementById('tabTotal').classList.remove('active');
  document.getElementById('weekSelect').style.display = 'block';
  render();
}

/* ── instant-load cache: the Apps Script call takes 2–3s, so show the last
      known numbers immediately and refresh in the background. ── */
const CACHE_KEY = 'mathclass:v1';
function readCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    return (c && c.data && c.data.ok) ? c : null;
  } catch (e) { return null; }
}
function writeCache(data) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data })); } catch (e) {}
}

let DATA = null;

async function load(force) {
  const btn = document.getElementById('refreshBtn');
  const cached = readCache();
  if (cached && !force && !DATA) { DATA = cached.data; render(); }

  btn.textContent = '↻ Updating…';
  try {
    const u = new URL(ENDPOINT_URL);
    u.searchParams.set('view', 'classes');
    const res = await fetch(u.toString());
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Could not load class progress');
    DATA = data;
    writeCache(data);
    render();
    btn.textContent = '↻ Refresh';
  } catch (e) {
    btn.textContent = '↻ Retry';
    if (!DATA) {
      document.getElementById('body').innerHTML =
        '<div class="msg"><h3>Could not load class progress</h3>' +
        'Please check your connection and try again.<br><br>' +
        '<span style="color:#94a3b8">(' + esc(e.message) + ')</span></div>';
    }
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function syncWeeks(weeks) {
  const sel = document.getElementById('weekSelect');
  if (sel.options.length === weeks.length && selectedWeek) return;
  sel.innerHTML = weeks.map(w => '<option value="' + esc(w) + '">' + esc(w) + '</option>').join('');
  if (weeks.length) {
    // default to the most recent week that has data
    selectedWeek = selectedWeek && weeks.indexOf(selectedWeek) >= 0 ? selectedWeek : weeks[weeks.length - 1];
    sel.value = selectedWeek;
  }
}

function clamp(p) { return Math.max(0, Math.min(100, p)); }

function meter(pct) {
  const p = Math.max(0, Math.min(100, pct));
  return '<div class="meter">' +
           '<div class="track"><div class="fill" style="width:' + p + '%"></div></div>' +
           '<div class="goal"></div>' +
           '<div class="arrow" style="left:' + p + '%"></div>' +
         '</div>';
}

function render() {
  const body = document.getElementById('body');
  const cap = document.getElementById('caption');
  const warn = document.getElementById('warn');
  if (!DATA) return;

  // ── roster not set up yet ──────────────────────────────────
  if (DATA.rosterMissing) {
    cap.textContent = '';
    warn.innerHTML = '';
    body.innerHTML =
      '<div class="msg"><h3>Almost there — the class list is missing</h3>' +
      'This board needs to know which class each student is in. In the Google Sheet, add a tab named ' +
      '<code>Roster</code> with exactly two columns:' +
      '<table><tr><th>Name</th><th>Class</th></tr>' +
      '<tr><td>Jaylee B</td><td>Ms. Hood</td></tr>' +
      '<tr><td>Anaya K</td><td>Ms. Hood</td></tr></table>' +
      'List <b>every</b> student in each class, not only the ones who have taken part — the class size is ' +
      'what each week is measured against. Then reload this page.</div>';
    return;
  }

  syncWeeks(DATA.weeks || []);
  const sel = document.getElementById('weekSelect');
  if (mode === 'week') selectedWeek = sel.value || selectedWeek;

  // ── names that submitted but aren't on the roster ──────────
  warn.innerHTML = (DATA.unmatched && DATA.unmatched.length)
    ? '<div class="warn"><b>' + DATA.unmatched.length + ' name' + (DATA.unmatched.length > 1 ? 's' : '') +
      ' not on the class list:</b> ' + DATA.unmatched.map(esc).join(', ') +
      '. Their points are not counted for any class — add them to the <code>Roster</code> tab, or fix the spelling there.</div>'
    : '';

  if (!DATA.classes.length || !DATA.weeks.length) {
    cap.textContent = '';
    body.innerHTML = '<div class="msg"><h3>No scored weeks yet</h3>' +
      'Once students start submitting and a week has its answer key filled in, each class’s progress will appear here.</div>';
    return;
  }

  const weekly = (mode === 'week');
  const label = weekly ? selectedWeek : 'the whole challenge so far';
  const nWeeks = DATA.weeks.length;

  cap.innerHTML = (weekly
    ? 'How much of what <b>' + esc(selectedWeek) + '</b> was worth each class collected — ' +
      'every student in the class × ' + (DATA.problems[selectedWeek] || 0) + ' problems.'
    : 'How much of everything available so far each class has collected, across <b>' + nWeeks +
      ' scored week' + (nWeeks > 1 ? 's' : '') + '</b>.') +
    '<br><span style="color:#94a3b8">Taking part lifts the blue bar even if every answer is wrong — ' +
    'and the two bars multiply together to make the class total.</span>';

  // Sort by progress, but present as meters — no ranks, no medals, no "last place".
  const rows = DATA.classes.map(c => {
    const b = DATA.byClass[c];
    const cell = weekly ? b.weeks[selectedWeek] : b.total;
    return { name: c, size: b.size, cell: cell, all: b };
  }).sort((a, b) => b.cell.pct - a.cell.pct || a.name.localeCompare(b.name));

  body.innerHTML = rows.map(r => {
    const c = r.cell;
    const took = weekly
      ? '<b>' + c.participants + '</b> of ' + r.size + ' students'
      : '<b>' + c.participants + '</b> of ' + c.slots + ' chances taken (' + r.size + ' students × ' + nWeeks + ' weeks)';

    let html = '<div class="card">' +
      '<div class="top">' +
        '<span class="cname">' + esc(r.name) + '</span>' +
        '<span class="csize">' + r.size + ' students</span>' +
        '<span class="pct">' + c.pct + '%</span>' +
      '</div>' +

      // Lever 1 — taking part. Moves even if every answer is wrong.
      '<div class="lever part">' +
        '<div class="row"><span class="lbl">Took part</span>' +
        '<span class="val">' + c.partPct + '%</span></div>' +
        '<div class="bar"><i style="width:' + clamp(c.partPct) + '%"></i></div>' +
        '<div class="note">' + took + '</div>' +
      '</div>';

    // Lever 2 — accuracy on what was actually attempted.
    if (c.acc !== null && c.acc !== undefined) {
      html += '<div class="lever right">' +
        '<div class="row"><span class="lbl">Got right</span>' +
        '<span class="val">' + c.acc + '%</span></div>' +
        '<div class="bar"><i style="width:' + clamp(c.acc) + '%"></i></div>' +
        '<div class="note"><b>' + c.points + '</b> right out of <b>' + c.tried + '</b> attempted</div>' +
      '</div>' +
      // Whole numbers and "≈": each figure is rounded to 1dp for display, so the
      // exact product can sit 0.1pp off the total. Rounding here keeps the line
      // readable and honest instead of inviting a calculator to disagree with it.
      '<div class="equals"><b>' + Math.round(c.partPct) + '%</b> took part<span class="x">×</span>' +
        '<b>' + Math.round(c.acc) + '%</b> got right<span class="x">≈</span>' +
        '<b>' + Math.round(c.pct) + '%</b> collected</div>';
    }

    html += '<div class="result">' +
      '<div class="mlbl">Points collected by the whole class</div>' +
      meter(c.pct) +
      '<div class="detail"><b>' + c.points + '</b> of ' + c.possible + ' points</div>' +
    '</div>';

    // week-by-week strip, only in the whole-challenge view
    if (!weekly) {
      html += '<div class="strip"><div class="lbl">Week by week</div>' +
        DATA.weeks.map(w => {
          const x = r.all.weeks[w];
          const short = w.replace(/^.*Week\s*/, 'Wk ').replace(/^Grade \d+ — /, '');
          return '<div class="wk' + (x.points ? '' : ' none') + '">' +
                   '<span class="n">' + esc(short) + '</span>' +
                   '<span class="bar"><i style="width:' + Math.max(0, Math.min(100, x.pct)) + '%"></i></span>' +
                   '<span class="v">' + x.points + '/' + x.possible + ' &middot; ' + x.pct + '%</span>' +
                 '</div>';
        }).join('') +
      '</div>';
    }
    return html + '</div>';
  }).join('');
}

load();
</script>
</body>
</html>
